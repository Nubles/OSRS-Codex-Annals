plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

sourceSets {
    dev {
        java.srcDir 'src/dev/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    devImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    devImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

group = 'com.codex.annals'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.dev.runtimeClasspath
    mainClass = 'com.codex.annals.CodexAnnalsPluginRunner'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

tasks.named('test') {
    // The card tests paint full 2x pictures (the Wrapped story is one tall image); the default 512 MB
    // test heap runs out on CI's Java 11 once the whole suite has run in the same worker.
    maxHeapSize = '1g'
}
